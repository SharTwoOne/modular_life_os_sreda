<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Reference</title>
<!--
  Витрина стиля. Истина — style-reference.md, эта страница её показывает.
  Заполняется ОДИН блок: объект TOKENS ниже. Вёрстку под ним не трогаем.
  Страница работает офлайн. Шрифты из сети подключаются через fontsHref, если он задан.
-->
<script>
const TOKENS = {
  example: true,              // ← убери эту строку, когда заполнишь значениями человека
  name: "Название стиля",
  owner: "Имя",
  updated: "2026-01-01",
  summary: "Три строки о стиле его словами.",
  fontsHref: "",              // ссылка Google Fonts или пусто, если шрифты системные или лежат рядом
  // Роли красят саму страницу. Значения — из style-reference.md, раздел «Цвет»
  roles: {
    bg: "#f6f5f2", surface: "#ffffff", text: "#1b1b1b", muted: "#6f6f6f",
    accent: "#3b5bdb", accentText: "#ffffff", border: "#dedcd6"
  },
  // Вся палитра, включая дополнительные цвета
  colors: [
    { token: "--bg", value: "#f6f5f2", role: "Фон страницы", from: "" },
    { token: "--surface", value: "#ffffff", role: "Карточки, плашки", from: "" },
    { token: "--text", value: "#1b1b1b", role: "Основной текст", from: "" },
    { token: "--muted", value: "#6f6f6f", role: "Второстепенный текст", from: "" },
    { token: "--accent", value: "#3b5bdb", role: "Акцент", from: "" },
    { token: "--border", value: "#dedcd6", role: "Линии и рамки", from: "" }
  ],
  fonts: {
    heading: { family: "Georgia, serif", note: "Заголовки" },
    body: { family: "system-ui, sans-serif", note: "Текст" }
  },
  type: [
    { name: "H1", font: "heading", size: "48px", line: "1.1", weight: 700, sample: "Заголовок первого уровня" },
    { name: "H2", font: "heading", size: "30px", line: "1.2", weight: 700, sample: "Заголовок второго уровня" },
    { name: "Текст", font: "body", size: "17px", line: "1.55", weight: 400, sample: "Обычный абзац: так выглядит основной текст на странице." },
    { name: "Подпись", font: "body", size: "13px", line: "1.4", weight: 400, sample: "Подпись и служебный текст" }
  ],
  radius: [{ token: "--radius", value: "12px" }],
  shadow: [{ token: "--shadow", value: "0 2px 12px rgba(0,0,0,.08)" }],
  spacing: [4, 8, 16, 24, 40],
  dos: ["Что можно"],
  donts: ["Чего нельзя"],
  sources: ["Откуда взят стиль: файл, ссылка или номер референса"]
};
</script>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
         font-size: 17px; line-height: 1.55; }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 20px 96px; }
  h1, h2 { font-family: var(--font-heading); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.05; }
  h2 { font-size: 24px; margin: 64px 0 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .lead { max-width: 62ch; margin: 16px 0 0; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .swatch { height: 88px; border-radius: calc(var(--radius) * .6); border: 1px solid var(--border);
            margin-bottom: 12px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .row { display: flex; gap: 20px; align-items: baseline; padding: 16px 0;
         border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .row > .meta { flex: 0 0 170px; }
  .row > .sample { flex: 1 1 320px; min-width: 0; overflow-wrap: anywhere; }
  .shapes { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .shape { width: 132px; height: 88px; background: var(--surface); border: 1px solid var(--border);
           display: grid; place-items: center; text-align: center; padding: 8px; }
  .space { background: var(--accent); height: 24px; border-radius: 3px; }
  .demo { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: var(--radius);
         border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .badge { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
           background: var(--surface); }
  input.field { font: inherit; padding: 12px 14px; border-radius: var(--radius);
                border: 1px solid var(--border); background: var(--surface); color: var(--text); min-width: 0; }
  .btn:focus-visible, input.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  ul { margin: 0; padding-left: 20px; }
  .warn { margin-top: 24px; padding: 12px 16px; border: 1px dashed var(--accent); border-radius: var(--radius); }
</style>
</head>
<body>
<main>
  <p class="muted small" id="meta"></p>
  <h1 id="title"></h1>
  <p class="lead" id="summary"></p>
  <p class="warn" id="example" hidden>Это пример. Значения ещё не заменены на стиль человека.</p>

  <h2>Цвет</h2>
  <div class="grid" id="colors"></div>

  <h2>Типографика</h2>
  <div id="type"></div>

  <h2>Формы</h2>
  <div class="shapes" id="shapes"></div>
  <p class="muted small" style="margin:24px 0 8px">Отступы</p>
  <div class="shapes" id="spacing"></div>

  <h2>Компоненты</h2>
  <div class="demo">
    <button class="btn" type="button">Главная кнопка</button>
    <button class="btn ghost" type="button">Вторая кнопка</button>
    <span class="badge">Метка</span>
    <input class="field" aria-label="Поле ввода" placeholder="Поле ввода">
  </div>
  <div class="grid" style="margin-top:20px">
    <div class="card">
      <strong>Карточка</strong>
      <p class="muted" style="margin:8px 0 0">Фон, рамка, радиус и тень из токенов.</p>
    </div>
  </div>

  <h2>Можно и нельзя</h2>
  <div class="two">
    <div class="card"><strong>Можно</strong><ul id="dos" style="margin-top:8px"></ul></div>
    <div class="card"><strong>Нельзя</strong><ul id="donts" style="margin-top:8px"></ul></div>
  </div>

  <h2>Откуда взят стиль</h2>
  <ul id="sources"></ul>
</main>
<script>
(function () {
  const T = TOKENS, root = document.documentElement.style;
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const $ = id => document.getElementById(id);

  if (T.fontsHref) {
    const l = el("link"); l.rel = "stylesheet"; l.href = T.fontsHref; document.head.appendChild(l);
  }
  const r = T.roles;
  root.setProperty("--bg", r.bg); root.setProperty("--surface", r.surface);
  root.setProperty("--text", r.text); root.setProperty("--muted", r.muted);
  root.setProperty("--accent", r.accent); root.setProperty("--accent-text", r.accentText);
  root.setProperty("--border", r.border);
  root.setProperty("--font-heading", T.fonts.heading.family);
  root.setProperty("--font-body", T.fonts.body.family);
  root.setProperty("--radius", (T.radius[0] || {}).value || "0px");
  root.setProperty("--shadow", (T.shadow[0] || {}).value || "none");

  document.title = "Style Reference — " + T.name;
  $("title").textContent = T.name;
  $("meta").textContent = "Style Reference · " + T.owner + " · обновлён " + T.updated;
  $("summary").textContent = T.summary;
  $("example").hidden = !T.example;

  T.colors.forEach(c => {
    const card = el("div", "card");
    const sw = el("div", "swatch"); sw.style.background = c.value;
    card.append(sw, el("strong", "", c.role), el("br"), el("code", "", c.token + " · " + c.value));
    if (c.from) { card.append(el("br"), el("span", "muted small", c.from)); }
    $("colors").appendChild(card);
  });

  T.type.forEach(t => {
    const row = el("div", "row"), meta = el("div", "meta");
    meta.append(el("strong", "", t.name), el("br"),
      el("span", "muted small", t.size + " / " + t.line + " · " + t.weight), el("br"),
      el("code", "", T.fonts[t.font].family));
    const s = el("div", "sample", t.sample);
    s.style.cssText = "font-family:" + T.fonts[t.font].family + ";font-size:" + t.size +
      ";line-height:" + t.line + ";font-weight:" + t.weight;
    row.append(meta, s); $("type").appendChild(row);
  });

  T.radius.forEach(x => {
    const s = el("div", "shape"); s.style.borderRadius = x.value;
    s.appendChild(el("code", "", x.token + " " + x.value)); $("shapes").appendChild(s);
  });
  T.shadow.forEach(x => {
    const s = el("div", "shape"); s.style.boxShadow = x.value; s.style.borderRadius = "var(--radius)";
    s.appendChild(el("code", "", x.token)); $("shapes").appendChild(s);
  });
  T.spacing.forEach(n => {
    const w = el("div"); const b = el("div", "space"); b.style.width = n + "px";
    w.append(b, el("code", "", String(n))); $("spacing").appendChild(w);
  });

  [["dos", T.dos], ["donts", T.donts], ["sources", T.sources]].forEach(([id, list]) =>
    list.forEach(x => $(id).appendChild(el("li", "", x))));
})();
</script>
</body>
</html>
